# NOTE: GitHub Actions is disabled for this repository (Settings > Actions; CI moved to PrairieDog,
# see .prairiedog.toml), so this workflow does not run. A run started while Actions is off
# stays "queued" with no jobs. Deploy by hand from site/ (see site/README.md) until Actions is
# turned back on.
#
# Deploys the Cloudflare Worker (the Worker domains: cubesatclass.org, cubesat.club and the
# other hubs) after CI passes on main, or when started by hand. GitHub Pages deploys docs/
# on its own.
#
# Repository secrets (Settings > Secrets and variables > Actions > Secrets):
#   CLOUDFLARE_API_TOKEN   an API token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the cubesat-classroom Worker
# Until both are set, this job fails on purpose, so a missing secret is never mistaken for a
# successful deploy. It only runs for pushes to main (after CI) or a manual start, never for
# pull requests or forks, so those are unaffected.
#
# Repository variable (Settings > Secrets and variables > Actions > Variables):
#   GUIDE_LIMITS_KV_ID     the id of the KV namespace bound as GUIDE_LIMITS, if the live quest
#                          guide is on. `wrangler deploy` replaces bindings with the ones in
#                          wrangler.jsonc, so without this a dashboard-only binding is removed
#                          and the guide falls back to prewritten answers.
name: Deploy Worker

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      GUIDE_LIMITS_KV_ID: ${{ vars.GUIDE_LIMITS_KV_ID }}
    defaults:
      run:
        working-directory: site
    steps:
      - name: Cloudflare secrets missing
        if: env.HAS_CLOUDFLARE != 'true'
        working-directory: .
        run: |
          echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not both set, so the Worker was NOT deployed. Add them under Settings > Secrets and variables > Actions, then re-run."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          # The commit CI checked, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - if: env.HAS_CLOUDFLARE == 'true'
        run: npm ci && npm run build
      - name: Keep the quest guide's KV binding
        if: env.HAS_CLOUDFLARE == 'true' && env.GUIDE_LIMITS_KV_ID != ''
        run: |
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs';
            const text = readFileSync('wrangler.jsonc', 'utf8').replace(/^\s*\/\/.*$/gm, '');
            const config = JSON.parse(text);
            config.kv_namespaces = [{ binding: 'GUIDE_LIMITS', id: process.env.GUIDE_LIMITS_KV_ID }];
            writeFileSync('wrangler.jsonc', JSON.stringify(config, null, 2));
          "
      - name: No KV binding configured
        if: env.HAS_CLOUDFLARE == 'true' && env.GUIDE_LIMITS_KV_ID == ''
        working-directory: .
        run: echo "::notice::GUIDE_LIMITS_KV_ID is not set, so this deploy has no GUIDE_LIMITS binding and the quest guide shows prewritten answers only."
      - uses: cloudflare/wrangler-action@9681c2997648301493e78cacbfb790a9f19c833f # v3.9.0
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.166.0'
          workingDirectory: site
          command: deploy
