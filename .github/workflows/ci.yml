# Checks every pull request and every push to main. Keep it fast and free of secrets,
# so pull requests from forks run the same checks as maintainers' branches.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  station:
    name: Rust station
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  site:
    name: Website and Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Worker loads
        run: node --input-type=module -e "await import('./src/worker.mjs')"
      - name: GitHub Pages copy in docs/ is up to date
        working-directory: .
        run: |
          (cd site && npm run build:github)
          git diff --exit-code -- docs || { echo "Run 'npm run build:github' in site/ and commit docs/."; exit 1; }

  mobile:
    name: Mobile app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  scripts:
    name: Installer and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n docs/start.sh scripts/*.sh
      - run: shellcheck docs/start.sh
      - run: python3 -m py_compile scripts/*.py tools/*.py hardware/*.py hardware/p1s/*.py
