# Checks every pull request and every push to main. Keep it fast and free of secrets,
# so pull requests from forks run the same checks as maintainers' branches.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  station:
    name: Rust station
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  site:
    name: Website and Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Worker behaviour tests (redirects, Origin check, preview gate, guide off)
        run: npm test
      - name: GitHub Pages copy in docs/ is up to date
        working-directory: .
        run: |
          (cd site && npm run build:github)
          if [ -n "$(git status --porcelain -- docs)" ]; then git status --short -- docs; echo "Run 'npm run build:github' in site/ and commit docs/."; exit 1; fi

  mobile:
    name: Mobile app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  firmware:
    name: Firmware (${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: Arduino Nano 33 BLE Sense Rev2
            fqbn: arduino:mbed_nano:nano33ble
            platforms: |
              - name: arduino:mbed_nano
            libraries: |
              - name: Arduino_APDS9960
              - name: Arduino_BMI270_BMM150
              - name: Arduino_HS300x
              - name: Arduino_LPS22HB
            sketches: |
              - firmware/arduino-cubesat
          - board: Arduino Uno R3
            fqbn: arduino:avr:uno
            platforms: |
              - name: arduino:avr
            libraries: "[]"
            sketches: |
              - firmware/classroom-sensors
          - board: XIAO ESP32-S3
            fqbn: esp32:esp32:XIAO_ESP32S3
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            libraries: |
              - name: Adafruit BME280 Library
              - name: Adafruit TSL2561
              - name: Adafruit Unified Sensor
              - name: Adafruit BusIO
              - name: U8g2
            sketches: |
              - firmware/xiao-cubesat
              - firmware/classroom-sensors
          - board: XIAO ESP32-C3
            fqbn: esp32:esp32:XIAO_ESP32C3
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            libraries: |
              - name: Adafruit BME280 Library
              - name: Adafruit TSL2561
              - name: Adafruit Unified Sensor
              - name: Adafruit BusIO
              - name: U8g2
            sketches: |
              - firmware/xiao-cubesat
              - firmware/classroom-sensors
          - board: XIAO RP2040
            fqbn: rp2040:rp2040:seeed_xiao_rp2040
            platforms: |
              - name: rp2040:rp2040
                source-url: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
            libraries: |
              - name: Adafruit BME280 Library
              - name: Adafruit TSL2561
              - name: Adafruit Unified Sensor
              - name: Adafruit BusIO
              - name: U8g2
            sketches: |
              - firmware/xiao-cubesat
              - firmware/classroom-sensors
          - board: XIAO SAMD21
            fqbn: Seeeduino:samd:seeed_XIAO_m0
            platforms: |
              - name: Seeeduino:samd
                source-url: https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json
            libraries: |
              - name: Adafruit BME280 Library
              - name: Adafruit TSL2561
              - name: Adafruit Unified Sensor
              - name: Adafruit BusIO
              - name: U8g2
              - name: SD
            sketches: |
              - firmware/xiao-cubesat
              - firmware/classroom-sensors
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: arduino/compile-sketches@3f3921bad94c706a153e6d7294445b49d7f76a63 # v1.1.4
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: ${{ matrix.platforms }}
          libraries: ${{ matrix.libraries }}
          sketch-paths: ${{ matrix.sketches }}
          enable-deltas-report: false
          enable-warnings-report: false

  hardware:
    name: Print files match the CAD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m venv /tmp/cad && /tmp/cad/bin/pip install -r hardware/requirements.txt
      - run: |
          /tmp/cad/bin/python hardware/generate.py
          /tmp/cad/bin/python hardware/p1s/prepare.py
          /tmp/cad/bin/python hardware/drawing.py
      - name: Committed STL, 3MF and drawing are up to date
        run: |
          if [ -n "$(git status --porcelain -- hardware)" ]; then git status --short -- hardware; echo "Regenerate the hardware files (see hardware/README.md) and commit them."; exit 1; fi

  scripts:
    name: Installer and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: bash -n docs/start.sh scripts/*.sh
      - run: shellcheck docs/start.sh scripts/*.sh
      - run: python3 -m py_compile scripts/*.py tools/*.py hardware/*.py hardware/p1s/*.py
