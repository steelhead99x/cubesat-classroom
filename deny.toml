# cargo-deny policy for the classroom Rust workspace: advisories, licenses, bans, sources.
[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"
# Unmaintained-crate notices (not vulnerabilities) with no safe upgrade upstream.
# Any other advisory fails `cargo deny check`.
ignore = [
  { id = "RUSTSEC-2026-0542", reason = "humantime: transitive of moq-tokio (=0.19.37), unmaintained notice only, no safe upgrade" },
  { id = "RUSTSEC-2026-0543", reason = "chrono: transitive of sgp4, unmaintained notice only, no safe upgrade" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
