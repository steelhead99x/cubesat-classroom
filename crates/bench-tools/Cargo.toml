[package]
name = "bench-tools"
version = "0.1.0"
description = "Bench tools for CubeSat Classroom: RTL-SDR sweeps, radio power logs and the XIAO photo downlink"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints.rust]
missing_docs = "warn"
# Only the serial-port setup in power.rs calls into libc (termios).
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
