[package]
name = "downlink"
description = "Desk simulation of a cleartext 915 MHz downlink and a telemetry-first fan-out schedule"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ciborium = "0.2"
crc32fast = "1.5"
fastrand = "2"
reed-solomon-simd = "3.1"
serde.workspace = true
serde_json.workspace = true

# Public items are documented. Unsafe is out of place in a framing exercise.
[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
