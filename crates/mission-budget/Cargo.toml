[package]
name = "mission-budget"
version = "0.1.0"
description = "Design-review link and energy budgets for CubeSat Classroom (planning numbers, not measurements)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true

# This crate is small and new, so it holds itself to clippy's pedantic set. CI's
# `cargo clippy -- -D warnings` turns any of these into an error.
[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Project and product names such as CubeSat are prose, not code.
doc_markdown = "allow"
