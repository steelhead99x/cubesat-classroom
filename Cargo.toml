[workspace]
# The ground station is the root package. Small, dependency-light libraries live in crates/.
# Both are default members, so `cargo test` and `cargo clippy` at the root cover everything.
members = [
    "crates/mission-budget",
    "crates/downlink",
    "crates/amsat-kit",
    "crates/cubesat-cad",
    "crates/cubesat-mission",
    "crates/bench-tools",
    "crates/printouts",
]
# The CAD crate builds the Manifold C++ kernel, so it has its own CI job instead of being a default member.
# The firmware targets the nRF52840 and is its own Cargo project.
exclude = ["firmware/nano33-cubesat"]
default-members = [
    ".",
    "crates/mission-budget",
    "crates/downlink",
    "crates/amsat-kit",
    "crates/cubesat-mission",
    "crates/bench-tools",
    "crates/printouts",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package]
name = "cubesat-classroom"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "cubesat-classroom"

[dependencies]
anyhow = "1"
axum = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
clap = { version = "4", features = ["derive", "env"] }
hang = "=0.21.24"
moq-tokio = { version = "=0.19.37", default-features = false, features = ["noq", "ring"] }
serde.workspace = true
serde_json.workspace = true
mission-budget = { path = "crates/mission-budget" }
downlink = { path = "crates/downlink" }
bench-tools = { path = "crates/bench-tools" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "sync"] }
url = "2"
sgp4 = "2"
